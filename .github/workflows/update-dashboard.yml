name: Atualiza dashboard S&OP

on:
  schedule:
    # 14:00 UTC = 11:00 no horário de Brasília (UTC-3).
    # Pra mudar o horário, troque só a hora abaixo (sempre em UTC: BRT + 3).
    - cron: '0 14 * * *'
  workflow_dispatch:   # botão "Run workflow" na aba Actions, pra rodar quando quiser

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar a dashboard (lê a planilha ao vivo)
        run: python generate.py

      - name: Checar rupturas e avisar por email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: python alerts.py

      - name: Commitar se algo mudou
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html model.json
          git add alert_state.json || true
          if git diff --staged --quiet; then
            echo "Nada mudou hoje — sem commit."
          else
            git commit -m "Atualiza dashboard (auto) — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Guardar debug se o parser falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-grid
          path: debug_grid.json
          if-no-files-found: ignore
